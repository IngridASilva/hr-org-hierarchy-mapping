# Roda os testes automaticamente a cada push e pull request
name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        run: pytest -v
      - name: Rodar o pipeline de ponta a ponta
        run: |
          python data/gerar_dados.py
          python -m src.hierarquia
